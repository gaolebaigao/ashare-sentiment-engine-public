[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-sentiment-engine"
version = "0.3.1"
description = "A-share market sentiment temperature, regime and risk-management engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
data = [
  "tushare>=1.4",
  "akshare>=1.16",
  "baostock>=0.9.3",
  "pyarrow>=15.0",
]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
desktop = ["PySide6>=6.7"]
packaging = ["PyInstaller>=6.0"]
research = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ashare-sentiment = "ashare_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashare_sentiment = ["webapp/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
